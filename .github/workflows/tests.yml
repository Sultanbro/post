name: API checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build local environment
        run: docker compose -f compose.local.yml build app
      - name: Start PostgreSQL, Keycloak and API
        run: docker compose -f compose.local.yml up -d --wait --wait-timeout 240
      - name: API regression tests
        run: docker compose -f compose.local.yml run --rm --no-deps app php vendor/bin/phpunit
      - name: End-to-end checks with Keycloak
        run: docker compose -f compose.local.yml exec -T app php docker/local/smoke.php
      - name: Stop local environment
        if: always()
        run: docker compose -f compose.local.yml down
