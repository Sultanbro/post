name: post-local
services:
  app:
    build:
      context: .
      dockerfile: docker/local/Dockerfile
    ports:
      - "127.0.0.1:${POST_DEMO_PORT:-8088}:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://localhost:8088
      APP_KEY: ""
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: post_demo
      DB_USERNAME: post_demo
      DB_PASSWORD: local-demo-only
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      TELESCOPE_ENABLED: "false"
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/post-demo/protocol/openid-connect/token
      KEYCLOAK_USERINFO_URL: http://keycloak:8080/realms/post-demo/protocol/openid-connect/userinfo
      KEYCLOAK_CLIENT_ID: post-demo
    healthcheck:
      test: ["CMD", "php", "docker/local/health.php"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: post_demo
      POSTGRES_USER: post_demo
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - demo-db:/var/lib/postgresql/data
      - ./docker/local/init-database.sql:/docker-entrypoint-initdb.d/test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U post_demo -d post_demo"]
      interval: 2s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./docker/local/post-demo-realm.json:/opt/keycloak/data/import/post-demo-realm.json:ro
volumes:
  demo-db:
